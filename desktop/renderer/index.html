<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Deep Sea Crew Host</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main>
      <header class="app-header">
        <div><p class="eyebrow">DEEP SEA CREW · HOST</p><h1>게임 서버 제어실</h1></div>
        <p class="intro">이 Mac이 게임 서버가 됩니다.</p>
      </header>
      <section class="dashboard" aria-label="서버 상태와 외부 공유 제어">
        <section class="card local-card"><div class="heading"><div><h2>로컬 게임 서버</h2><p id="server-status">상태 확인 중…</p></div><span id="server-badge" class="badge">확인 중</span></div><code>http://localhost:3001</code><div class="actions"><button id="start-server">서버 실행</button><button id="stop-server" class="secondary">서버 종료</button><button id="open-local" class="ghost">게임 열기</button></div></section>
        <section class="card share-card"><div class="heading"><div><h2>Cloudflare 외부 공유</h2><p id="cloudflare-status">외부 공개는 꺼져 있습니다.</p></div><span id="cloudflare-badge" class="badge muted">비공개</span></div><p class="note">로그인은 선택 사항입니다. 외부 공개 승인 시 Quick Tunnel 주소를 만듭니다.</p><div class="actions"><button id="login-cloudflare" class="secondary">Cloudflare 로그인</button><button id="share-cloudflare">외부 공개 승인</button><button id="stop-cloudflare" class="danger">외부 공개 종료</button></div><div id="invite" class="invite" hidden><strong>외부 초대 주소</strong><code id="external-url"></code><button id="copy-url" class="ghost">주소 복사</button></div></section>
      </section>
      <footer><p id="message" class="message"></p><p class="footnote">외부 공유에는 <code>cloudflared</code>가 필요합니다.</p></footer>
    </main>
    <script src="./renderer.js"></script>
  </body>
</html>
